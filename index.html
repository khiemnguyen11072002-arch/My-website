<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Trang học tiếng Anh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{color-scheme:light;--bg:#FFFFFF;--soft:#F5F8F6;--ink:#1C2B2A;--mute:#5B706D;--pri:#0F6B63;--on:#FFFFFF;--amber:#F2A93B;--ok:#2E9E73;--bad:#D6455D;--tint:#E3F0EC;--line:#D8E4E0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:20px;min-height:60vh}
.hint{color:var(--mute);font-size:.95rem;border:1.5px dashed var(--line);border-radius:16px;padding:20px;text-align:center}
</style></head><body>
<main id="trang">
<p class="hint">Trang trống, sẵn sàng thêm từng phần theo vị trí bạn chỉ định.</p>
</main>
</body></html>
